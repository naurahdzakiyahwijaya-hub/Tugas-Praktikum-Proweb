<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Game Suit Sederhana</title>
    
    <style>
        body {
            font-family: Times New Roman, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgb(230, 196, 253);
            padding: 20px;
            border-radius: 8px;

            text-align: center;
            width: 350px;
        }

        select {
            color:#774caf;
            font-size: 14px;
            width: 90%;
            padding: 8px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
            background-color: #774caf;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .hasil-box {
            margin-top: 20px;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }
    </style>
</head>
<body>

   <div class="container">
        <h1>GAME SUIT SEDERHANA</h1>

        <p>Pilih Jenis Suit:</p>
        <select id="pilihan-suit" onchange="gantiSuit()">
            <option value="bgs">Batu, Gunting, Kertas</option>
            <option value="gos">Gajah, Orang, Semut</option>
            <option value="jari">Jempol, Telunjuk, Kelingking</option>
        </select>

        <p>Silakan Pilih:</p>
        
        <div id="area-tombol"></div>

        <div class="hasil-box">
            <p id="info-pilihan">Pilihanmu: - | Komputer: -</p>
            <h2 id="info-hasil">-</h2>
        </div>
    </div>

    <script>
        let jenisPermainan = "bgs"; 

        function gantiSuit() {
            jenisPermainan = document.getElementById("pilihan-suit").value;
            buatTombol();
        }

        function buatTombol() {
            const areaTombol = document.getElementById("area-tombol");
            areaTombol.innerHTML = ""; 

            let daftarPilihan = [];

            if (jenisPermainan === "bgs") {
                daftarPilihan = ["Batu", "Gunting", "Kertas"];
            } else if (jenisPermainan === "gos") {
                daftarPilihan = ["Gajah", "Orang", "Semut"];
            } else if (jenisPermainan === "jari") {
                daftarPilihan = ["Jempol", "Telunjuk", "Kelingking"];
            }

            daftarPilihan.forEach(function(item) {
                let btn = document.createElement("button");
                btn.innerText = item;
                btn.onclick = function() {
                    mainkanGame(item, daftarPilihan);
                };
                areaTombol.appendChild(btn);
            });
        }

        function mainkanGame(pilihanPemain, daftarPilihan) {
            let pilihanKomputer = daftarPilihan[Math.floor(Math.random() * daftarPilihan.length)];
            let hasil = "";

            if (pilihanPemain === pilihanKomputer) {
                hasil = "SERI!";
            } else if (jenisPermainan === "bgs") {
                if (
                    (pilihanPemain === "Batu" && pilihanKomputer === "Gunting") ||
                    (pilihanPemain === "Gunting" && pilihanKomputer === "Kertas") ||
                    (pilihanPemain === "Kertas" && pilihanKomputer === "Batu")
                ) {
                    hasil = "KAMU MENANG!";
                } else {
                    hasil = "KAMU KALAH!";
                }
            } else if (jenisPermainan === "gos") {
                if (
                    (pilihanPemain === "Gajah" && pilihanKomputer === "Orang") ||
                    (pilihanPemain === "Orang" && pilihanKomputer === "Semut") ||
                    (pilihanPemain === "Semut" && pilihanKomputer === "Gajah")
                ) {
                    hasil = "KAMU MENANG!";
                } else {
                    hasil = "KAMU KALAH!";
                }
            } else if (jenisPermainan === "jari") {
                if (
                    (pilihanPemain === "Jempol" && pilihanKomputer === "Telunjuk") ||
                    (pilihanPemain === "Telunjuk" && pilihanKomputer === "Kelingking") ||
                    (pilihanPemain === "Kelingking" && pilihanKomputer === "Jempol")
                ) {
                    hasil = "KAMU MENANG!";
                } else {
                    hasil = "KAMU KALAH!";
                }
            }


            document.getElementById("info-pilihan").innerText = "Pilihanmu: " + pilihanPemain + " | Komputer: " + pilihanKomputer;
            document.getElementById("info-hasil").innerText = hasil;
        }

        // Jalankan saat pertama kali dibuka
        buatTombol();
    </script>
</body>
</html>
